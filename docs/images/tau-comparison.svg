<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" width="760" height="458" role="img" aria-labelledby="title desc">
<title id="title">How the tau sets the pace</title>
<desc id="desc">Share of the way from the old weight to the new one — the same for every tau, rising or falling. Each dot sits at its tau: 63% of the way there.</desc>
