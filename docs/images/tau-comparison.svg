<rect class="bg" width="760" height="458" rx="8"/>
<text x="24" y="32" class="t1 title" text-anchor="start">How the tau sets the pace</text>
<text x="24" y="52" class="t2" text-anchor="start">Share of the way from the old weight to the new one — the same for every tau,</text>
<text x="24" y="72" class="t2" text-anchor="start">rising or falling. Each dot sits at its tau: 63% of the way there.</text>
