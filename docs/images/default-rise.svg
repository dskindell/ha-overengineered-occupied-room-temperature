<text x="24" y="32" class="t1 title" text-anchor="start">Rising, with the default settings</text>
<text x="24" y="52" class="t2" text-anchor="start">Weight of an empty room after someone arrives at minute 0; it starts</text>
<text x="24" y="72" class="t2" text-anchor="start">rising after the enter delay. Dots mark one tau after that: 63% of the way.</text>
