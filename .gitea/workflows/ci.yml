# Tests, coverage floor and lint on every push to main (and on pull requests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python 3.14 and test dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements_test.txt

      - name: Tests with coverage floor
        run: >
          .venv/bin/python -m pytest -q
          --cov=custom_components/overengineered_occupied_room_temperature
          --cov-branch --cov-report=term-missing --cov-fail-under=97

      - name: Lint
        run: uvx ruff check --select F,E9,B custom_components tests
