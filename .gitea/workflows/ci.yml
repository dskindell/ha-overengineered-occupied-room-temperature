# Tests, coverage floor, lint, formatting, type checking, repository rules and hassfest on every push
# to main (and on pull requests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python 3.14 and test dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements_test.txt

      - name: Tests with coverage floor
        run: >
          .venv/bin/python -m pytest -q
          --cov=custom_components/overengineered_occupied_room_temperature
          --cov-branch --cov-report=term-missing --cov-fail-under=97

      - name: Lint
        run: uvx ruff@0.16.9 check custom_components tests scripts

      - name: Format
        run: uvx ruff@0.16.9 format --check custom_components tests scripts

      - name: No design references in the code
        run: .venv/bin/python scripts/check_rules.py references

      - name: Commit messages
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # A force-push or a new branch has no usable "before", so only the tip is checked.
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$HEAD_SHA"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA^!"
          fi
          .venv/bin/python scripts/check_rules.py commits "$range"

      - name: Type check
        run: |
          uv pip install --python .venv/bin/python mypy==2.3.1
          .venv/bin/python -m mypy custom_components/overengineered_occupied_room_temperature

  hassfest:
    # Home Assistant's own integration validator (manifest, translations, config
    # flow). Runs the same image as the home-assistant/actions/hassfest action.
    # The checkout is copied in with `docker cp`: a bind mount would point at the
    # runner host's filesystem, not this job's container.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: hassfest
        run: |
          id=$(docker create ghcr.io/home-assistant/hassfest)
          docker cp . "$id":/github/workspace
          status=0
          docker start --attach "$id" || status=$?
          docker rm "$id" > /dev/null
          exit "$status"
