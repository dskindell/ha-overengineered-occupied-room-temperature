# Publishes a GitHub release for each pushed version tag (vX.Y.Z, or vX.Y.Z-beta.N as a
# pre-release), with that version's section of CHANGELOG.md as the notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/overengineered_occupied_room_temperature/manifest.json'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the manifest version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG isn't on main"
            exit 1
          fi

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## [${TAG#v}]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { if (found) exit } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      - name: Create the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$TAG" == *-* ]]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "$kind"
